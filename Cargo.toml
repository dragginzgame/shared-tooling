[package]
name = "toko-tooling"
version = "0.40.2"
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
description = "Shared development tools, CI helpers and engineering rules for Toko Studios"
repository = "https://github.com/dragginzgame/toko-tooling"
publish = ["crates-io"]
readme = "docs/toko-tooling.md"
include = [
    "/src/**", "/scripts/**", "/make/**", "/ci/**", "/docs/**",
    "/rules/**", "/tasks/**", "/audits/**", "/licenses/**", "/LICENSE.md",
    "/.github/**", "/.githooks/**", "/Makefile", "/rust-toolchain.toml",
    "/AGENTS.md", "/TOKO-TOOLING.md", "/CONTRIBUTING.md", "/README.md",
    "/CHANGELOG.md", "!/ci/frontend/node_modules/**",
    "!/docs/code-review/**",
]

# Consumer dev-dependencies and Cargo.lock select this source bundle.
# Installation remains explicit:
# make toko-tooling-install refreshes scripts and prepares the pinned tools.
[lib]
path = "src/lib.rs"

[lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
