[package]
name = "toko-tooling"
version = "0.37.5"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Shared development tools, CI helpers and engineering rules for Dragginzgame"
repository = "https://github.com/dragginzgame/toko-tooling"
publish = ["crates-io"]
readme = "docs/toko-tooling.md"
include = [
    "/src/**", "/scripts/**", "/make/**", "/ci/**", "/docs/**",
    "/rules/**", "/tasks/**", "/audits/**", "/licenses/**",
    "/.github/**", "/.githooks/**", "/Makefile", "/rust-toolchain.toml",
    "/AGENTS.md", "/TOKO-TOOLING.md", "/CONTRIBUTING.md", "/README.md",
    "/CHANGELOG.md", "/LICENSE", "!/ci/frontend/node_modules/**",
    "!/docs/code-review/**",
]

# Consumer dev-dependencies and Cargo.lock select this source bundle.
# Installation remains explicit:
# make toko-tooling-install refreshes scripts and prepares the pinned tools.
[lib]
path = "src/lib.rs"
