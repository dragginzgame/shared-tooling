name: Retain failed validation and installer evidence
description: One collection contract for ordinary failures and hosted retention qualification.
inputs:
  name:
    description: Unique artifact name for this job and attempt.
    required: true
  temp-root:
    description: Absolute root containing validation logs and portable-fixtures.
    required: true
  repository-root:
    description: Absolute checkout root containing retained tool candidates.
    required: true
outputs:
  artifact-id:
    description: Uploaded artifact identity, used for the hosted round-trip check.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: upload
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.name }}
        path: |
          ${{ inputs.temp-root }}/portable-regression.log
          ${{ inputs.temp-root }}/portable-fixtures
          ${{ inputs.temp-root }}/host-tools-*.log
          ${{ inputs.temp-root }}/ic-tools-*.log
          ${{ inputs.repository-root }}/.tools/host-set.*
          ${{ inputs.repository-root }}/.tools/ic-set.*
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: ignore
