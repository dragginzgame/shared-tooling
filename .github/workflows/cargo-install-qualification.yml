name: Cargo installation qualification

# Explicit assessment for #65; registry builds do not enlarge the default
# portable gate or run during ordinary offline validation.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cargo-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare reviewed host tools
        run: |
          make --no-print-directory install-host-tools host-tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Qualify real registry binary and example installation
        run: |
          mkdir -p "$RUNNER_TEMP/portable-fixtures"
          bash scripts/ci/qualify-cargo-install.sh "$RUNNER_TEMP/portable-fixtures/cargo-install" \
            2>&1 | tee "$RUNNER_TEMP/rust-tools-qualification.log"
      - name: Retain failed builds and qualification evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: cargo-install-failure-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
