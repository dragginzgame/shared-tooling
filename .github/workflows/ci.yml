name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

concurrency:
  # Preserve each pushed source's native qualification, including queued jobs.
  # PR updates may still replace validation of an older review revision.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned validation tools
        shell: bash
        run: |
          source ci/tool-versions.env
          tool_dir="$RUNNER_TEMP/shared-tooling-bin"
          actionlint_bin="$(bash scripts/ci/install-actionlint.sh \
            --version "$SHARED_TOOLING_ACTIONLINT_VERSION" \
            --sha256 "$SHARED_TOOLING_ACTIONLINT_SHA256_LINUX_AMD64" \
            --install-dir "$tool_dir")"
          shellcheck_bin="$(bash scripts/ci/install-shellcheck.sh \
            --version "$SHARED_TOOLING_SHELLCHECK_VERSION" \
            --sha256 "$SHARED_TOOLING_SHELLCHECK_SHA256_LINUX_X86_64" \
            --install-dir "$tool_dir")"
          gitleaks_bin="$(bash scripts/ci/install-gitleaks.sh \
            --version "$SHARED_TOOLING_GITLEAKS_VERSION" \
            --sha256 "$SHARED_TOOLING_GITLEAKS_SHA256_LINUX_X64" \
            --install-dir "$tool_dir")"
          make --no-print-directory install-host-tools
          make --no-print-directory host-tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          {
            echo "ACTIONLINT_BIN=$actionlint_bin"
            echo "SHELLCHECK_BIN=$shellcheck_bin"
            echo "GITLEAKS_BIN=$gitleaks_bin"
          } >>"$GITHUB_ENV"
      - name: Check shell and workflow sources
        shell: bash
        run: |
          "$SHELLCHECK_BIN" scripts/ci/*.sh scripts/dev/*.sh scripts/distribution/*.sh scripts/release/*.sh .githooks/pre-commit
          "$ACTIONLINT_BIN" .github/workflows/*.yml
          make check-pins
          make check-doc-links
      - name: Scan repository history for secrets
        shell: bash
        run: |
          "$GITLEAKS_BIN" git \
            --redact=100 \
            --no-banner \
            --no-color \
            --log-level error \
            "$GITHUB_WORKSPACE"

  portable-regression:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install fixture dependencies on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
      - name: Select system Bash on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo /bin >> "$GITHUB_PATH"
      - name: Install pinned Cargo manifest formatter
        shell: bash
        run: |
          source ci/tool-versions.env
          cargo install cargo-sort --version "$SHARED_TOOLING_CARGO_SORT_VERSION" \
            --locked --root "$RUNNER_TEMP/shared-tooling-cargo"
          echo "$RUNNER_TEMP/shared-tooling-cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned parsers, ripgrep and cloc
        shell: bash
        run: |
          make --no-print-directory install-host-tools 2>&1 | tee "$RUNNER_TEMP/host-tools-install.log"
          make --no-print-directory host-tools-check 2>&1 | tee "$RUNNER_TEMP/host-tools-check.log"
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Select the frontend fixture runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ci/frontend/package.json
          package-manager-cache: false
      - name: Prepare the locked frontend fixture
        run: |
          test "$(npm --version)" = "$(jq -er '.engines.npm' ci/frontend/package.json)"
          npm ci --prefix ci/frontend
      - name: Run portable regression set with prepared tools
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/portable-fixtures
        run: |
          mkdir -p "$TMPDIR"
          bash --version | head -n 1
          bash scripts/ci/test-portable-tools.sh 2>&1 | tee "$RUNNER_TEMP/portable-regression.log"
      - name: Qualify the real frontend formatter and Rust hook
        env:
          TMPDIR: ${{ runner.temp }}/portable-fixtures
        run: |
          bash scripts/ci/test-frontend-formatting.sh 2>&1 | tee "$RUNNER_TEMP/portable-fixtures/frontend-formatting.log"
      - name: Qualify pinned native IC executables
        shell: bash
        run: |
          make --no-print-directory install-ic-tools 2>&1 | tee "$RUNNER_TEMP/ic-tools-install.log"
          make --no-print-directory ic-tools-check 2>&1 | tee "$RUNNER_TEMP/ic-tools-check.log"
      - name: Exercise expected native installer and check failures
        id: retention
        continue-on-error: true
        run: bash scripts/ci/qualify-native-failure-retention.sh "$RUNNER_TEMP/portable-fixtures/native-retention"
      - name: Upload the native failure qualification evidence
        if: ${{ !cancelled() && steps.retention.outcome == 'failure' }}
        id: retention-upload
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: native-retention-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}/portable-fixtures/native-retention/temp
          repository-root: ${{ runner.temp }}/portable-fixtures/native-retention/consumer
      - name: Download the uploaded native failure evidence
        if: ${{ !cancelled() && steps.retention-upload.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.retention-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/native-retention-downloaded
          merge-multiple: true
      - name: Verify native failure status and uploaded payload
        if: ${{ !cancelled() && steps.retention.outcome != 'skipped' }}
        env:
          RETENTION_OUTCOME: ${{ steps.retention.outcome }}
          RETENTION_QUALIFIED: ${{ steps.retention.outputs.qualified }}
        run: |
          test "$RETENTION_OUTCOME" = failure
          test "$RETENTION_QUALIFIED" = true
          cd "$RUNNER_TEMP/native-retention-downloaded"
          mkdir payload
          tar -xzf evidence.tar.gz -C payload
          cd payload
          bash "$GITHUB_WORKSPACE/scripts/ci/verify-evidence-checksums.sh" "$RUNNER_TEMP/portable-fixtures/native-retention/expected.sha256"
          cmp "$RUNNER_TEMP/portable-fixtures/native-retention/temp/portable-fixtures/"$'line\nbreak:payload' "portable-fixtures/"$'line\nbreak:payload'
          test "$(perl -e 'printf "%o", (stat($ARGV[0]))[2] & 0777' "portable-fixtures/"$'line\nbreak:payload')" = 640
          test -x .tools/ic-set.check/bin/quill
          test -L portable-fixtures/link
          test "$(readlink portable-fixtures/link)" = ../outside-evidence
          test ! -e portable-fixtures/link
      - name: Prepare failed candidate alongside verified native toolsets
        if: ${{ !cancelled() && steps.retention.outputs.qualified == 'true' }}
        id: compact-control
        shell: bash
        run: |
          candidate="$(mktemp -d "$GITHUB_WORKSPACE/.tools/ic-set.evidenceXXXXXX")"
          cp -R "$RUNNER_TEMP/portable-fixtures/native-retention/consumer/.tools/ic-set.check/." "$candidate/"
          printf 'candidate=%s\n' "${candidate##*/}" >> "$GITHUB_OUTPUT"
      - name: Upload compact native tool evidence
        if: ${{ !cancelled() && steps.compact-control.outputs.candidate != '' }}
        id: compact-upload
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: native-compact-tools-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}/portable-fixtures/native-retention/temp
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
      - name: Download compact native tool evidence
        if: ${{ !cancelled() && steps.compact-upload.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.compact-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/compact-tools-downloaded
          merge-multiple: true
      - name: Verify compact native tool evidence and retained candidate
        if: ${{ !cancelled() && steps.compact-upload.outputs.artifact-id != '' }}
        env:
          EVIDENCE_CANDIDATE: ${{ steps.compact-control.outputs.candidate }}
        shell: bash
        run: |
          payload="$RUNNER_TEMP/compact-tools-downloaded/payload"
          mkdir "$payload"
          tar -xzf "$RUNNER_TEMP/compact-tools-downloaded/evidence.tar.gz" -C "$payload"
          shopt -s nullglob
          diagnostics=("$payload"/tool-evidence.*)
          test "${#diagnostics[@]}" = 1
          for kind in host ic; do
            selection="$(cat "${diagnostics[0]}/$kind/selection.txt")"
            test ! -e "$payload/.tools/${selection##*/}"
            test -s "${diagnostics[0]}/$kind/check.log"
          done
          cmp ci/tool-versions.env "${diagnostics[0]}/host/caller-pins"
          cmp ci/ic-tools.tsv "${diagnostics[0]}/ic/caller-pins"
          for receipt in pins.tsv host files.sha256; do
            cmp ".tools/ic/$receipt" "${diagnostics[0]}/ic/$receipt"
          done
          cmp ".tools/$EVIDENCE_CANDIDATE/bin/quill" "$payload/.tools/$EVIDENCE_CANDIDATE/bin/quill"
          test -x "$payload/.tools/$EVIDENCE_CANDIDATE/bin/quill"
          for log in ic-tools-install ic-tools-check rust-tools-install rust-tools-check; do
            cmp "$RUNNER_TEMP/portable-fixtures/native-retention/temp/$log.log" "$payload/$log.log"
          done
      - name: Retain failed validation and installer evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: portable-failure-${{ matrix.os }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
